 if(t.dataset.dietDia!==undefined){state.dia=+t.dataset.dietDia;render();return}
 if(t.dataset.quem==="ver-dia"){state.verDia=t.dataset.v;render();return}
 if(t.dataset.dietWho!==undefined){state.dietWho=t.dataset.dietWho;state.dietDraft=null;render();return}
 if(t.dataset.go!==undefined){state.dia=+t.dataset.go;state.editing=null;state.tab="dia";render();scrollTo(0,0);return}
 if(t.dataset.agua){addAgua(t.dataset.agua,+t.dataset.ml||0);return}
 if(t.dataset.rpe){setRpe(t.dataset.rpe,+t.dataset.v);return}
 if(t.dataset.pr){setPront(t.dataset.pr,t.dataset.q,+t.dataset.v);return}
 /* importação de resultados: escolher o dono, salvar ou cancelar; remover resultado lançado errado */
 if(t.dataset.resDono!==undefined){if(state.resDraft){state.resDraft.who=t.dataset.resDono==="power"?"power":"pace";render()}return}
 if(t.dataset.act==="res-salvar"){salvarRes();return}
 if(t.dataset.act==="res-cancelar"){state.resDraft=null;say("upl-res","Importação cancelada. Nada foi salvo.");render();return}
 if(t.dataset.act==="del-res"){
  const w=t.dataset.who,d=+t.dataset.d,l=state.res[w]&&state.res[w][d];if(!l)return;
  const i=l.findIndex(x=>resKey(x)===t.dataset.key);if(i<0)return;
  if(!confirm(`Remover este resultado ${doDa(w)}?`))return;
  l.splice(i,1);mergeNow(pRes(),{[w]:{[d]:l}},state.res).then(ok=>say("upl-res",ok?"Resultado removido ✓":"Removido só neste aparelho: sem conexão com a nuvem."));
  state.rh.loaded=false;render();return;
 }
 if(t.dataset.act==="carga-salvar"){salvarCarga(t.closest(".form-carga"));return}
 if(t.dataset.act==="carga-edit"){state.cargaEdit=t.dataset.k;render();return}
 if(t.dataset.resNav!==undefined){const id=resIds()[+t.dataset.resNav];if(id){state.rh.sel=id;render();loadSemRH(id)}return}
 if(t.dataset.resWho!==undefined){state.rh.who=t.dataset.resWho;render();return}
 if(t.dataset.act==="res-reload"){state.rh.loaded=false;render();return}
 if(t.dataset.act==="ia-analise"){iaAnalise(t.dataset.who);return}
 if(t.dataset.tabGo){state.tab=t.dataset.tabGo;render();scrollTo(0,0);return}
 if(t.dataset.opt){state.log.opt[t.dataset.d]=t.dataset.opt;state.editing=null;saveLog({opt:{[t.dataset.d]:t.dataset.opt}});render();return}
 if(t.dataset.genWho!==undefined){const a=document.getElementById("ajustes");if(a)state.ajustesTxt=a.value;state.genWho=t.dataset.genWho;render();return}
 const act=t.dataset.act;
 if(act==="redo-card"){if(state.redo&&state.redo.ctl)state.redo.ctl.abort();state.editing=null;state.redo={d:+t.dataset.d,slot:t.dataset.slot,pedido:"",draft:null,loading:false,err:""};render();return}
 if(act==="redo-go")return redoGo();
 if(act==="redo-use")return redoUse();
 if(act==="redo-retry"){if(state.redo){state.redo.draft=null;render()}return}
 if(act==="redo-cancel"){if(state.redo&&state.redo.ctl)state.redo.ctl.abort();state.redo=null;render();return}
 if(act==="usar-parte")return usarParte();
 if(act==="desc-parte"){state.partDraft=null;render();return}
 if(act==="diet-st"){
  const who=state.dietWho==="pace"?"pace":"power";
  const k=`${state.dia}:${who}`;
  state.log.dietStatus=state.log.dietStatus||{};
  state.log.dietStatus[k]=(state.log.dietStatus[k]===t.dataset.st)?"":t.dataset.st;
  const obsEl=document.getElementById("diet-obs-input");
  /* só grava a observação se algo foi digitado; caixa vazia não apaga a que já estava salva */
  const obsTx=obsEl?obsEl.value.trim():"";
  const part={dietStatus:{[k]:state.log.dietStatus[k]}};
  if(obsTx){state.log.dietObs=state.log.dietObs||{};state.log.dietObs[k]=obsTx;part.dietObs={[k]:obsTx}}
  state.dietObsDraft=null;
  dietSaved(k,saveLog(part));return;
 }
 if(act==="save-diet-obs"){
  const who=state.dietWho==="pace"?"pace":"power";
  const k=`${state.dia}:${who}`;
  const obsEl=document.getElementById("diet-obs-input");
  const obsTx=obsEl?obsEl.value.trim():"";
  if(!obsTx)return; /* nada digitado: não apaga a observação já salva */
  state.log.dietObs=state.log.dietObs||{};
  state.log.dietObs[k]=obsTx;
  state.dietObsDraft=null;
  dietSaved(k,saveLog({dietObs:{[k]:state.log.dietObs[k]}}));return;
 }
 if(act==="apr-del"){const w=t.dataset.who,l=(state.memoria||{})[w];if(!l)return;l.splice(+t.dataset.i,1);mergeNow("aprendizados/v2",{[w]:l},state.memoria);render();return}
 if(act==="hist-reload"){state.hist=null;render();return}
 if(act==="imp-res")return pick("res",".csv,.txt,.tsv,.pdf,image/*",t.dataset.who||"pace",true);
 if(act==="imp-dieta")return pick("dieta",".pdf,.docx,.txt,image/*");
 if(act==="imp-lib")return pick("lib",".txt,.md,.pdf,.docx,.csv,image/*");
 if(act==="imp-runsheet")return pick("runsheet",".pdf,.txt,.csv,image/*");
 if(act==="paste-lib"){const tx=document.getElementById("paste-lib").value.trim();if(tx)importLib({text:tx},"texto colado");return}
 if(act==="paste-week"){
  const st=document.getElementById("gst");
  try{
   const raw=document.getElementById("paste-week-json").value.trim().replace(/^```json\s*/i,"").replace(/```\s*$/,"");
   const w=JSON.parse(raw);if(!valid(w))throw 0;
   w.dias.forEach(d=>{if(!d.pace.corrida)d.pace.corrida=null});
   state.draft=w;{const pv=document.getElementById("prev");if(pv)pv.innerHTML=prevHTML(w)}if(st)st.textContent="Semana carregada! Confira abaixo e clique em Usar esta semana.";
  }catch(err){if(st)st.textContent="Formato inválido. Cole o bloco JSON completo da semana."}
  return;
 }
 if(act==="edit-card"){state.redo=null;state.editing={dia:+t.dataset.d,slot:t.dataset.slot};render();return}
 if(act==="cancel-edit"){state.editing=null;render();return}
 if(act==="save-edit"){
  const box=t.closest(".edit-form"),d=+box.dataset.editDia,slot=box.dataset.editSlot;
  const target=slot==="power"?state.week.dias[d].power:(slot==="corrida"?state.week.dias[d].pace.corrida:state.week.dias[d].pace[slot]);
  if(target){
   target.titulo=box.querySelector('[data-ef="titulo"]').value.trim()||target.titulo;
   target.desc=box.querySelector('[data-ef="desc"]').value.trim();
   target.min=+box.querySelector('[data-ef="min"]').value||0;
   target.rpe=+box.querySelector('[data-ef="rpe"]').value||0;
   const lines=box.querySelector('[data-ef="itens"]').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
   if(slot==="corrida"){target.passos=lines;}
   else{
    /* exercícios que não mudaram mantêm descrição e números do KPI; blocos mantêm voltas, modo e explicação */
    const velhos=new Map(),voltas=new Map();(target.blocos||[]).forEach(b=>{voltas.set(b.nome,{voltas:b.voltas,modo:b.modo,como:b.como});(b.itens||[]).forEach(i=>{if(i&&typeof i==="object")velhos.set(i.t,i)})});
    const bls=[];let cur={nome:"Treino",itens:[]};
    lines.forEach(ln=>{if(ln.startsWith("#")){if(cur.itens.length)bls.push(cur);const nome=ln.replace(/^#+\s*/,"")||"Bloco";cur={nome,itens:[]};if(voltas.has(nome)){const m=voltas.get(nome);["voltas","modo","como"].forEach(x=>{if(m[x])cur[x]=m[x]})}}else cur.itens.push(velhos.get(ln)||ln)});
    if(cur.itens.length)bls.push(cur);
    target.blocos=bls;
   }
   savePlanSlots([[d,slot]]);
  }
  state.editing=null;render();return;
 }
 if(act==="usar-dieta"){const d=state.dietDraft;if(!d)return;
  if(d.who==="power"){const doc={data:d.data||"",kcal:d.kcal||null,titulo:d.titulo||"",resumo:d.resumo||"",macros:d.macros||[],notas:d.notas||"",refeicoes:d.refeicoes};applyDietPo(doc);save("dieta-ewerton/v2",doc)}
  else{applyDiet(d);save("dieta/v2",{data:state.diet.data,kcal:state.diet.kcal,refeicoes:MEALS_JOANNA})}
  state.dietDraft=null;render();return}
 if(act==="desc-dieta"){state.dietDraft=null;render();return}
 if(act==="aplicar"){const card=t.closest(".apply");aplicar(t.dataset.id,+card.querySelector('[data-role="dia"]').value,card.querySelector('[data-role="slot"]').value);return}
 if(act==="del-lib")return delLib(t.dataset.id);
 if(act==="save-key"){const inp=document.getElementById("nova-apikey");const val=(inp&&inp.value||"").trim();if(val){localStorage.setItem("gemini_api_key",val);state.cfg.geminiKey=val;save(P_CFG,state.cfg);render();}return}
 if(t.dataset.cat){state.libFilter=t.dataset.cat;render();return}
 if(t.id==="gerar")gerar(); if(t.id==="parar")ctl?.abort(); if(t.id==="usar")usar();
 if(t.id==="desc"){state.draft=null;{const pv=document.getElementById("prev");if(pv)pv.innerHTML=""}GEN_ST.textContent=""}
});
/* atualização do outro aparelho que esperou a pessoa terminar de digitar: aplica ao sair do campo
   (com um pequeno atraso, para não engolir o toque num botão logo em seguida) */
view.addEventListener("focusout",()=>{
 if(!state.pendRender)return;
 setTimeout(()=>{if(state.pendRender&&!digitando()){state.pendRender=false;render()}},400);
});
/* guarda o rascunho da observação a cada tecla, para não perder o texto se a tela for redesenhada */
view.addEventListener("input",e=>{
 if(e.target.id==="diet-obs-input")state.dietObsDraft={k:e.target.dataset.k,v:e.target.value};
});
view.addEventListener("change",e=>{
 if(e.target.id==="res-week"){state.rh.sel=e.target.value;render();loadSemRH(e.target.value);return}
 if(e.target.dataset.prfc){const k=e.target.dataset.prfc,fc=parseInt(e.target.value)||0;state.log.prontidao=state.log.prontidao||{};(state.log.prontidao[k]=state.log.prontidao[k]||{}).fc=fc;saveLog({prontidao:{[k]:{fc}}});return}
 if(e.target.dataset.cg)return;
 const k=e.target.dataset.k;
 if(k){setC(k,e.target.checked);if(state.tab==="dia"&&/:(treino|corrida)$/.test(k))render();return}
 const c=e.target.dataset.cfg;if(!c)return;const val=e.target.value.trim();
 if(c==="pace")state.cfg.paces[+e.target.dataset.i]=val;
 if(c==="np")state.cfg.nomes.power=val||"Ewerton";
 if(c==="na")state.cfg.nomes.pace=val||"Joanna";
 if(c==="prova")state.cfg.prova=val;
 if(c==="peso-power"||c==="peso-pace"){const kg=parseFloat(val.replace(",","."));state.cfg.pesos={...(state.cfg.pesos||{}),[c.slice(5)]:kg>=30&&kg<=200?kg:0}}
 if(c==="apikey"){state.cfg.geminiKey=val;if(val)localStorage.setItem("gemini_api_key",val);else localStorage.removeItem("gemini_api_key");lsSet(P_CFG,state.cfg);return}
 /* grava só o campo que mudou: se os dois mexem nos ajustes ao mesmo tempo, um não apaga o do outro */
 const part=c==="pace"?{paces:state.cfg.paces}:c==="np"?{nomes:{power:state.cfg.nomes.power}}:c==="na"?{nomes:{pace:state.cfg.nomes.pace}}
  :c==="prova"?{prova:state.cfg.prova}:{pesos:{[c.slice(5)]:state.cfg.pesos[c.slice(5)]}};
 mergeNow(P_CFG,part,state.cfg);renderRemoto();
});
document.getElementById("wk").addEventListener("change",e=>{if(e.target.id==="wk-switch")switchWeek(e.target.value)});

document.getElementById("fileIn").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;const k=e.target.dataset.kind;
 if(k==="res")importRes(e.target.files.length>1?[...e.target.files]:f,e.target.dataset.who||"pace");
 if(k==="dieta")importDieta(f);
 if(k==="runsheet")importRunSheet(f);
 if(k==="lib"){say("upl-lib","Lendo o arquivo…");try{importLib(await readInput(f),f.name)}catch(err){say("upl-lib",ERR(err))}}
});

/* Inicialização e Observadores em Tempo Real */
function applyCfg(c){if(!c)return;if(Array.isArray(c.paces))state.cfg.paces=c.paces;if(c.nomes)state.cfg.nomes={...state.cfg.nomes,...c.nomes};if(c.pesos)state.cfg.pesos={...state.cfg.pesos,...c.pesos};if(typeof c.prova==="string")state.cfg.prova=c.prova;}
function applyLog(l){l=l||{};state.log={chk:l.chk||{},opt:l.opt||{},dietStatus:l.dietStatus||{},dietObs:l.dietObs||{},agua:l.agua||{},rpe:l.rpe||{},prontidao:l.prontidao||{},cargas:l.cargas||{}}}

let unsubWeek=[];
/* a aba Resultados guarda a semana atual: mantém ela apontando para os dados vivos */
function syncRH(){const W=state.rh&&state.rh.weeks&&state.rh.weeks[state.week.id];if(W)Object.assign(W,{res:state.res,log:state.log,plan:state.week})}
/* atualização vinda do outro aparelho: se a pessoa está digitando, espera ela sair do campo para redesenhar */
function digitando(){const a=document.activeElement,v=document.getElementById("view");return !!(a&&v&&v.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=="checkbox"&&a.type!=="radio")}
function renderRemoto(){if(digitando()){state.pendRender=true;return}render()}
function bindWeekWatchers(){
 unsubWeek.forEach(fn=>{try{fn()}catch(e){}});
 unsubWeek=[];
 if(!window.fb||!window.fb.ready)return;
 const pl=pLog(),pr=pRes();
 unsubWeek.push(window.fb.watch(pl,(l)=>{
  if(pl!==pLog())return; /* chegou atrasado de uma semana que já foi trocada */
  applyLog(l);lsSet(pl,state.log);syncRH();renderRemoto();
 }));
 unsubWeek.push(window.fb.watch(pr,(rr)=>{
  if(pr!==pRes())return;
  state.res={pace:(rr&&rr.pace)||{},power:(rr&&rr.power)||{}};
  lsSet(pr,state.res);syncRH();renderRemoto();
 }));
}

async function initCloud(){
 /* o script do Firebase é um módulo e só roda depois deste: espera ele ficar pronto */
 for(let i=0;i<150&&!window.dbReady;i++)await new Promise(r=>setTimeout(r,100));
 if(!window.dbReady){fbFail({code:"load-failed"});return}
 const ok=await window.dbReady;
 if(!ok||!window.fb||!window.fb.ready){fbFail(window.fbError||{code:"unavailable"});return}
 try{await window.fb.get(P_CFG);await window.fb.merge("status/ping",{t:Date.now()})}
 catch(e){fbFail(e);return}
 state.connected=true;syncOk();
 /* ainda sem conta Google neste aparelho: abre a tela de login (depois de escolher quem está usando) */
 {const u=window.fb.user();if(u&&u.anonimo&&state.eu&&!state.sheet){state.sheet="conta";renderSheet()}}
 /* primeiro manda o que foi marcado enquanto o app ainda não estava conectado; senão a nuvem apagaria */
 await enviarPendentes();

 /* carrega tudo ao mesmo tempo (antes era um depois do outro) */
 const [hw,hwl,hc,dPa,dPo,items]=await Promise.all([load(P_PLAN),load(P_WEEKS),load(P_CFG),load("dieta/v2"),load("dieta-ewerton/v2"),window.fb.listLib().catch(()=>null)]);
 if(valid(hw)){state.week=hw;state.currentId=hw.id}
 if(hwl&&Array.isArray(hwl.list))state.weeks=hwl.list;
 else state.weeks=[{id:state.week.id,nome:state.week.nome}];
 if(hc)applyCfg(hc);
 applyDiet(dPa);applyDietPo(dPo);
 const [hl,hrr]=await Promise.all([load(pLog()),load(pRes())]);
 applyLog(hl);
 if(hrr)state.res={pace:hrr.pace||{},power:hrr.power||{}};
 if(items){state.lib=items.sort((a,b)=>(a.criado||0)-(b.criado||0));lsSet("biblioteca",state.lib)}
 /* o histórico pode ter sido montado antes de conectar, só com a semana atual: recarrega */
 state.hist=null;state.histLoading=false;

 /* Sincronização em tempo real entre dispositivos */
 window.fb.watch(P_PLAN,(w)=>{
  if(!valid(w))return;
  const wasCurrent=!state.currentId||state.week.id===state.currentId;
  state.currentId=w.id;lsSet(P_PLAN,w);
  if(!wasCurrent)return; /* quem está olhando uma semana antiga continua nela */
  const changed=w.id!==state.week.id;state.week=w;
  if(changed){state.hist=null;load(pLog()).then(l=>{applyLog(l);load(pRes()).then(rr=>{state.res={pace:(rr&&rr.pace)||{},power:(rr&&rr.power)||{}};syncRH();bindWeekWatchers();renderRemoto()})})}
  else{syncRH();renderRemoto()}
 });
 window.fb.watch(P_CFG,(c)=>{applyCfg(c);lsSet(P_CFG,state.cfg);renderRemoto()});
 window.fb.watch(P_WEEKS,(wl)=>{if(wl&&Array.isArray(wl.list)){state.weeks=wl.list;renderRemoto()}});
 window.fb.watch("dieta/v2",(d)=>{applyDiet(d);lsSet("dieta/v2",d);renderRemoto()});
 window.fb.watch("dieta-ewerton/v2",(d)=>{applyDietPo(d);lsSet("dieta-ewerton/v2",d);renderRemoto()});
 /* memória do treinador: aprendizados que a IA usa para evoluir os treinos semana a semana */
 window.fb.watch("aprendizados/v2",(m)=>{state.memoria={power:(m&&m.power)||[],pace:(m&&m.pace)||[]};lsSet("aprendizados/v2",state.memoria);if(state.tab==="nova")renderRemoto()});
 bindWeekWatchers();
 render();
}

(function init(){
 const w=lsGet(P_PLAN);if(valid(w)){state.week=w;state.currentId=w.id}
 applyLog(lsGet(pLog()));applyCfg(lsGet(P_CFG));
 const lr=lsGet(pRes());if(lr)state.res={pace:lr.pace||{},power:lr.power||{}};
 applyDiet(lsGet("dieta/v2"));applyDietPo(lsGet("dieta-ewerton/v2"));state.lib=lsGet("biblioteca")||[];
 state.weeks=[{id:state.week.id,nome:state.week.nome}];
 /* perfil deste celular; na primeira vez pergunta quem está usando */
 state.eu=lsGet("eu");aplicarEu();if(!state.eu)state.sheet="eu";
 state.dia=Math.max(0,todayIdx());render();
 initCloud();
  /* app instalável e abre sem internet (só em https, como na Vercel) */
 if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("/sw.js").catch(()=>{});
 fetch("/api/gemini").then(r=>r.ok?r.json():null).then(j=>{if(j&&j.ok){state.aiServer=true;render()}}).catch(()=>{});
})();
</script>
