<!doctype html>
<html lang="pt-BR" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#EDEFEE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pace &amp; Power">
<meta name="mobile-web-app-capable" content="yes">
<title>Pace &amp; Power</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&display=swap" rel="stylesheet">
<style>
/* Design Tokens - Tema Claro Fixo para máxima legibilidade */
:root{
  --bg:#EEF1F7; --surface:#FFFFFF; --surface-2:#F5F7FB; --ink:#16204A; --muted:#5A6482; --line:#D8DDEA; --line-2:#E7EBF3;
  --power:#3B2FD9; --power-soft:#E8E6FC; --pace:#D6336C; --pace-soft:#FBE4ED;
  --z1:#9AA5AE; --z2:#3B82C4; --z3:#3FA34D; --z4:#E8892B; --z5:#D63C3C;
  --ok:#23885A; --warn:#C27803; --on-ink:#FFFFFF;
  --f:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--power);outline-offset:2px;border-radius:6px}
.cond{font-stretch:72%}

/* Topo fixo original claro translúcido */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.bar-in{max-width:1120px;margin:0 auto;padding:12px 20px 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.mark{font-weight:900;font-style:italic;font-stretch:68%;font-size:1.75rem;line-height:1;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.mark .pa{color:var(--pace)} .mark .po{color:var(--power)} .mark .amp{color:var(--muted);font-weight:500}
.mark svg{flex:none}
.wk{color:var(--muted);font-size:.9rem;flex:1;min-width:180px}
.wk b{color:var(--ink);font-weight:650}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--z1);margin-right:6px;vertical-align:middle}
.sync-dot.on{background:var(--ok)}
.race{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 6px;font-size:.85rem;white-space:nowrap}
.race .n{font-stretch:72%;font-weight:850;font-size:1.15rem;color:var(--power);background:var(--power-soft);border-radius:999px;padding:0 9px;line-height:1.5}
nav.tabs{max-width:1120px;margin:0 auto;padding:10px 20px 10px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:.93rem;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--on-ink)}

.wrap{max-width:1120px;margin:0 auto;padding:22px 20px 72px}
.banner{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px;font-size:.92rem;color:var(--muted);margin-bottom:16px}

/* Faixa de dias */
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:22px}
.strip button{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:9px 4px 8px;cursor:pointer;text-align:center;transition:border-color .15s}
.strip button:hover{border-color:var(--muted)}
.strip button[aria-pressed="true"]{background:linear-gradient(160deg,var(--ink),#26306B);border-color:var(--ink);color:var(--on-ink);box-shadow:0 6px 16px -8px rgba(22,32,74,.55)}
.strip button[aria-pressed="true"] .dt{color:inherit;opacity:.75}
.strip .d{font-stretch:72%;font-weight:800;font-size:1.2rem;line-height:1;color:inherit}
.strip .dt{font-size:.75rem;color:var(--muted);margin-top:2px}
.strip .run{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--pace)}
.strip .ticks{display:flex;justify-content:center;gap:4px;margin-top:6px}
.tick{width:14px;height:4px;border-radius:2px;background:var(--line)}
.tick.po.on{background:var(--power)} .tick.pa.on{background:var(--pace)}
.strip .hoje{color:var(--pace);font-weight:700}
.strip button[aria-pressed="true"] .hoje{color:#FF9DBE}

.dayhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.dayname{font-stretch:65%;font-weight:900;font-size:clamp(3.4rem,12vw,7rem);line-height:.82;letter-spacing:-.02em}
.daydate{font-stretch:80%;font-weight:600;font-size:1.25rem;color:var(--muted)}
.daynote{max-width:72ch;color:var(--muted);margin:12px 0 22px}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media (max-width:780px){.cols{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:14px}
.colhead{display:flex;align-items:center;gap:10px;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 10px 3px 8px}
.badge i{width:8px;height:8px;border-radius:50%}
.badge.po{background:var(--power-soft);color:var(--power)} .badge.po i{background:var(--power)}
.badge.pa{background:var(--pace-soft);color:var(--pace)} .badge.pa i{background:var(--pace)}
.colhead .goal{font-weight:500;font-size:.85rem;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.zs{display:flex;height:6px;background:var(--line-2)} .zs span{height:100%}
.ci{padding:16px 18px 18px}
.kind{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.src{font-size:.75rem;font-weight:700;border:1px solid var(--pace);color:var(--pace);border-radius:999px;padding:1px 8px}
.card h3{font-stretch:72%;font-weight:800;font-size:1.85rem;line-height:1.02;margin:4px 0 8px;letter-spacing:-.005em}
.stats{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.88rem;color:var(--muted);margin-bottom:6px}
.stats b{color:var(--ink);font-weight:700;font-stretch:80%;font-size:1.05rem}
.bl{margin-top:14px}
.bl h4{margin:0 0 4px;font-size:.88rem;font-weight:700}
.bl ul{margin:0;padding-left:18px} .bl li{margin:5px 0;font-size:.95rem}
.how{display:block;font-size:.84rem;color:var(--muted);line-height:1.4;margin-top:1px}
.desc{margin:0 0 6px;color:var(--muted);font-size:.93rem;max-width:62ch}
.steps{list-style:none;margin:12px 0 0;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line-2);font-size:.95rem}
.steps li::before{content:counter(s);font-stretch:72%;font-weight:800;color:var(--muted);font-size:1.05rem;line-height:1.4}
.zc{display:inline-flex;align-items:baseline;gap:4px;font-size:.76rem;font-weight:750;line-height:1.45;padding:0 6px;border-radius:5px;color:#fff;vertical-align:1px;white-space:nowrap}
.zc.z1{background:var(--z1)}.zc.z2{background:var(--z2)}.zc.z3{background:var(--z3)}.zc.z4{background:var(--z4)}.zc.z5{background:var(--z5)}
.zc small{font-weight:550;opacity:.92;font-size:.72rem}
.note{margin-top:12px;font-size:.88rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;margin:10px 0 2px;max-width:100%}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:650;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--pace);box-shadow:0 0 0 1px var(--line)}

.checks{border-top:1px dashed var(--line);padding:12px 18px 16px;background:var(--surface-2)}
.checks .t{font-size:.8rem;color:var(--muted);margin:0 0 6px}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px 4px 8px;font-size:.86rem;cursor:pointer;user-select:none}
.chk input{accent-color:var(--ok);width:16px;height:16px;margin:0}
.chk label:has(input:checked){border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.chk .sub{width:100%;font-size:.8rem;color:var(--muted);margin-top:8px}

h2.sec{font-stretch:68%;font-weight:900;font-size:clamp(2.2rem,6vw,3.2rem);line-height:.95;margin:0 0 8px;letter-spacing:-.01em}
p.lead{color:var(--muted);margin:0 0 20px;max-width:68ch}

/* Semana */
.tbl{overflow-x:auto}
table.week{width:100%;min-width:720px;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
table.week th,table.week td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line-2)}
table.week tbody tr:last-child td{border-bottom:0}
table.week thead th{font-size:.82rem;font-weight:700;background:var(--surface-2)}
table.week td.dia{width:84px}
table.week td.dia b{font-stretch:68%;font-weight:900;font-size:1.5rem;line-height:1;display:block}
table.week td.dia span{font-size:.78rem;color:var(--muted)}
table.week tbody tr{cursor:pointer}
table.week tbody tr:hover td{background:var(--surface-2)}
.tt{font-weight:650;line-height:1.3}
.mt{font-size:.82rem;color:var(--muted)}
.run-line{font-size:.85rem;margin-bottom:4px;color:var(--pace);font-weight:650}
.mb{display:flex;height:4px;border-radius:2px;overflow:hidden;margin-top:6px;max-width:170px;background:var(--line-2)} .mb span{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Painel */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px}
.panel h3{font-stretch:72%;font-weight:850;font-size:1.5rem;margin:0;line-height:1.1}
.panel .sub{color:var(--muted);font-size:.86rem;margin:4px 0 12px}
.wide{grid-column:1/-1}
svg text{font-family:var(--f);fill:var(--muted);font-size:12px}
.pol{display:flex;align-items:baseline;gap:8px;margin:6px 0 4px}
.pol .big{font-stretch:68%;font-weight:900;font-size:2.4rem;line-height:1}
.meter{position:relative;height:8px;border-radius:4px;background:var(--line-2);margin-bottom:6px}
.meter span{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--z2)}
.meter i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.row{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;padding:7px 0;border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:0}
.row b{font-stretch:80%}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.form label{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.form input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-sm);padding:7px 9px}

/* Nutrição & Diário de Adesão */
.diet-tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;margin-bottom:18px}
.diet-tabs button{border:0;background:transparent;border-radius:999px;padding:7px 16px;font-size:.9rem;font-weight:700;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.diet-tabs button i{width:8px;height:8px;border-radius:50%}
.diet-tabs button.po i{background:var(--power)}
.diet-tabs button.pa i{background:var(--pace)}
.diet-tabs button.po[aria-pressed="true"]{background:var(--power-soft);color:var(--power)}
.diet-tabs button.pa[aria-pressed="true"]{background:var(--pace-soft);color:var(--pace)}

.diet-meta{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:16px}
.diet-meta.po{border-left:4px solid var(--power)}
.diet-meta.pa{border-left:4px solid var(--pace)}
.macro-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.macro-pill{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.macro-pill.po{background:var(--power-soft);color:var(--power);border-color:transparent}
.macro-pill.pa{background:var(--pace-soft);color:var(--pace);border-color:transparent}

.rot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin-top:12px}
.rot-item{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:7px 9px;font-size:.82rem}
.rot-item b{display:block;font-size:.75rem;color:var(--power);text-transform:uppercase}

.diet-log{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:18px}
.diet-log-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.diet-day-pills{display:flex;flex-wrap:wrap;gap:4px}
.diet-day-pills button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 11px;font-size:.82rem;font-weight:700;color:var(--muted);cursor:pointer}
.diet-day-pills button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}

.status-group{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.status-group button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:.85rem;font-weight:650;color:var(--muted);cursor:pointer}
.status-group button[data-st="ok"][aria-pressed="true"]{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface));color:var(--ok)}
.status-group button[data-st="partial"][aria-pressed="true"]{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface));color:var(--warn)}
.status-group button[data-st="off"][aria-pressed="true"]{border-color:var(--z5);background:color-mix(in srgb,var(--z5) 12%,var(--surface));color:var(--z5)}

.diet-obs-row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.diet-obs-row textarea{flex:1;min-width:240px;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-md);padding:9px 12px;resize:vertical;min-height:58px}

.diet-week-cards{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:14px}
@media (max-width:780px){.diet-week-cards{grid-template-columns:repeat(2,1fr)}}
.dw-card{border:1px solid var(--line-2);background:var(--surface-2);border-radius:var(--r-sm);padding:8px 9px;font-size:.8rem}
.dw-card.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:color-mix(in srgb,var(--ok) 8%,var(--surface))}
.dw-card.partial{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 8%,var(--surface))}
.dw-card.off{border-color:color-mix(in srgb,var(--z5) 45%,var(--line));background:color-mix(in srgb,var(--z5) 8%,var(--surface))}
.dw-card b{display:block;font-size:.78rem}
.dw-card .st-lbl{font-weight:700;margin-top:2px}
.dw-card .st-note{color:var(--muted);margin-top:3px;line-height:1.35;word-break:break-word}

.meals{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px}
.meal .h{display:flex;align-items:baseline;gap:10px}
.meal .time{font-stretch:68%;font-weight:900;font-size:1.7rem;line-height:1;color:var(--pace)}
.meal .time.po{color:var(--power)}
.meal h4{margin:0;font-size:1.05rem;font-weight:750}
.meal ul{margin:8px 0 0;padding-left:18px;font-size:.92rem} .meal li{margin:2px 0}
.meal .obs{font-size:.82rem;color:var(--muted);margin-top:6px}
.meal details{margin-top:10px;border-top:1px solid var(--line-2);padding-top:8px}
.meal summary{cursor:pointer;font-size:.88rem;font-weight:650;color:var(--muted)}
.sub-opt{margin-top:10px}
.sub-opt b{font-size:.84rem}
.adh{overflow-x:auto;margin-top:18px}
.adh table{border-collapse:separate;border-spacing:0;min-width:560px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.adh th,.adh td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line-2);font-size:.9rem}
.adh tbody tr:last-child td{border-bottom:0}
.adh th:first-child,.adh td:first-child{text-align:left}
.adh thead th{background:var(--surface-2);font-weight:700;font-size:.82rem}
.adh input{accent-color:var(--ok);width:17px;height:17px}
.fine{font-size:.85rem;color:var(--muted);margin-top:14px}

/* Nova semana e utilitários */
.gen{max-width:780px}
.gen textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:10px 12px;resize:vertical}
.runs{display:grid;gap:10px;margin:8px 0 18px}
.runs label{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start;font-stretch:72%;font-weight:800;font-size:1.15rem}
.runs textarea{min-height:52px;font-stretch:100%;font-weight:400;font-size:.92rem}
.lbl{font-weight:700;font-size:.92rem;margin:0 0 6px}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--on-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.status{margin-top:12px;color:var(--muted);font-size:.92rem;min-height:1.4em}
.tool{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.tool .lead{margin:0}
.btn.sm{padding:7px 14px;font-size:.88rem}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.link{border:0;background:none;padding:0;color:var(--pace);font-weight:650;font-size:.88rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.real{margin-top:12px;border:1px solid color-mix(in srgb,var(--ok) 45%,var(--line));background:color-mix(in srgb,var(--ok) 7%,var(--surface));border-radius:var(--r-md);padding:10px 12px}
.real .t{font-size:.8rem;font-weight:700;color:var(--ok);margin:0 0 2px}
.real .stats{margin:0}
.real .cmp{font-size:.84rem;color:var(--muted)}
.real + .real{margin-top:8px}
.upl{margin-top:10px;font-size:.9rem;color:var(--muted);min-height:1.3em}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:.86rem;font-weight:600;color:var(--muted);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.lib{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;align-items:start}
.lib .card details{border-top:1px solid var(--line-2);margin-top:10px;padding-top:4px}
.lib .card summary{cursor:pointer;font-size:.88rem;font-weight:650;color:var(--muted);padding:6px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px}

<!-- Conexão com o Firebase (Projeto: power-e-pace) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYOxtQ9u_c69GWOSzvO5z9aEdKaYVInjQ",
  authDomain: "power-e-pace.firebaseapp.com",
  projectId: "power-e-pace",
  storageBucket: "power-e-pace.firebasestorage.app",
  messagingSenderId: "894286895156",
  appId: "1:894286895156:web:ae86d4ae7976fd9d3cd261"
};

window.dbReady = new Promise(async (resolve) => {
  try {
    const projectId = "power-e-pace";
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    await signInAnonymously(auth);

    const refOf = (path) => {
      const parts = path.split("/").filter(Boolean);
      return doc(db, "artifacts", projectId, "public", "data", ...parts);
    };

    window.fb = {
      ready: true,
      async get(path) {
        const snap = await getDoc(refOf(path));
        return snap.exists() ? snap.data() : null;
      },
      async set(path, data) {
        await setDoc(refOf(path), JSON.parse(JSON.stringify(data)));
      },
      async merge(path, data) {
        await setDoc(refOf(path), JSON.parse(JSON.stringify(data)), { merge: true });
      },
      watch(path, cb) {
        return onSnapshot(refOf(path), (snap) => {
          if (snap.exists()) cb(snap.data());
        }, (err) => {
          console.warn("Firestore watch:", err);
          if (window.onFbError) window.onFbError(err);
        });
      },
      async listLib() {
        const coll = collection(db, "artifacts", projectId, "public", "data", "biblioteca");
        const q = await getDocs(coll);
        return q.docs.map(d => ({ ...d.data(), id: d.id }));
      },
      async saveLib(id, data) {
        const dRef = doc(db, "artifacts", projectId, "public", "data", "biblioteca", id);
        await setDoc(dRef, JSON.parse(JSON.stringify(data)));
      },
      async delLib(id) {
        const dRef = doc(db, "artifacts", projectId, "public", "data", "biblioteca", id);
        await deleteDoc(dRef);
      }
    };
    resolve(true);
  } catch (e) {
    console.error("Erro ao conectar no Firebase:", e);
    window.fbError = e;
    resolve(false);
  }
});
</script>

/* Armazenamento local + sincronização em nuvem (Firebase) */
const LS="pp2:";
const lsGet=p=>{try{const v=localStorage.getItem(LS+p);return v?JSON.parse(v):null}catch(e){return null}};
const lsSet=(p,d)=>{try{localStorage.setItem(LS+p,JSON.stringify(d))}catch(e){}};

async function load(p){
 if(window.fb&&window.fb.ready){
  try{
   const v=await window.fb.get(p);
   if(v!==null){lsSet(p,v);return v;}
  }catch(e){}
 }
 return lsGet(p);
}

const tm={};
function cloudCopy(p,d){
 /* a chave do Gemini nunca vai para a nuvem: fica só no aparelho */
 if(p===P_CFG&&d){const c=JSON.parse(JSON.stringify(d));c.geminiKey="";return c}
 return d;
}
function save(p,d){
 lsSet(p,d);
 if(!window.fb||!window.fb.ready||state.readOnly) return;
 clearTimeout(tm[p]);
 tm[p]=setTimeout(async()=>{
  try{await window.fb.set(p,cloudCopy(p,d));syncOk()}
  catch(e){fbFail(e)}
 },450);
}
/* grava só o pedaço que mudou no registro da semana, sem apagar o que o outro marcou */
function saveLog(part){
 lsSet(pLog(),state.log);
 if(!window.fb||!window.fb.ready||state.readOnly) return;
 window.fb.merge(pLog(),part).then(syncOk).catch(fbFail);
}

function setSync(kind,text,detail){const el=document.getElementById("sync");if(!el)return;el.className="sync "+kind;el.querySelector("span").textContent=text;el.title=detail||text;el.onclick=kind==="err"?()=>alert(detail||text):null}
function syncOk(){setSync("ok","Online","Os dados estão salvos na nuvem e aparecem nos dois aparelhos.")}
function fbFail(e){
 const code=(e&&e.code)||"";const msg=FB_MSG[code]||("Erro ao salvar na nuvem"+(code?` (${code})`:"")+". Os dados ficaram só neste aparelho.");
 console.error("Firebase:",code,(e&&e.message)||e);
 if(code==="permission-denied")state.readOnly=true;
 setSync("err","Offline",msg);banner(msg);
}

function chart(series,unit){
 const W=560,H=200,pl=34,pb=24,pt=10,iw=W-pl-8,ih=H-pb-pt,gw=iw/6,bw=Math.min(22,(gw-14)/series.length);
 const m=Math.max(1,...series.flatMap(s=>s.values)),st=m>200?100:m>50?25:m>10?5:2,top=Math.ceil(m/st)*st;
 let g="";for(let k=0;k<=4;k++){const y=pt+ih-ih*k/4;g+=`<line x1="${pl}" x2="${W-8}" y1="${y}" y2="${y}" stroke="var(--line-2)"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${Math.round(top*k/4)}</text>`}
 let b="";for(let i=0;i<6;i++){const x0=pl+gw*i+(gw-bw*series.length-4*(series.length-1))/2;
  series.forEach((s,j)=>{const v=s.values[i]||0,h=ih*v/top;b+=`<rect x="${x0+j*(bw+4)}" y="${pt+ih-h}" width="${bw}" height="${h}" rx="4" fill="${s.color}"><title>${esc(s.name)}: ${num(v)} ${unit}</title></rect>`});
  b+=`<text x="${pl+gw*i+gw/2}" y="${H-6}" text-anchor="middle">${AB[i]}</text>`}
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico por dia">${g}${b}</svg><div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`;
}

/* Evolução: desempenho semana a semana */
function weekStats(plan,log,res){
 const chk=(log&&log.chk)||{},D=(plan&&plan.dias)||[];
 const c=(w,k)=>[0,1,2,3,4,5].filter(i=>chk[`${i}:${w}:${k}`]).length;
 const poPlan=D.filter(d=>d.power&&!/opcional/i.test((d.power.titulo||"")+" "+(d.power.tipo||""))).length||5;
 const runs=D.filter(d=>d.pace&&d.pace.corrida).length;
 const runsDone=D.filter((d,i)=>d.pace&&d.pace.corrida&&chk[i+":pace:corrida"]).length;
 const kmOf=w=>Object.values((res&&res[w])||{}).flat().filter(a=>a&&a.run).reduce((s,a)=>s+(+a.km||0),0);
 const mealsOf=(w,list)=>[0,1,2,3,4,5].reduce((s,i)=>s+list.filter(m=>chk[`${i}:${w}:${m.k}`]).length,0);
 const po=Math.min(c("power","treino"),poPlan),pa=c("pace","treino");
 return {po,poPlan,pa,runs,runsDone,
  adPo:poPlan?po/poPlan:0, adPa:(6+runs)?(pa+runsDone)/(6+runs):0,
  kmPa:kmOf("pace"),kmPo:kmOf("power"),
  sonoPo:c("power","sono"),sonoPa:c("pace","sono"),
  refPo:mealsOf("power",DIET_EWERTON.refeicoes)/(DIET_EWERTON.refeicoes.length*6||1),
  refPa:mealsOf("pace",MEALS_JOANNA)/(MEALS_JOANNA.length*6||1)};
}
async function loadHist(){
 if(state.histLoading)return;state.histLoading=true;
 const list=(state.weeks&&state.weeks.length?state.weeks:[{id:state.week.id,nome:state.week.nome}]).slice(-12);
 const out={};
 for(const w of list){
  if(w.id===state.week.id)continue;
  try{out[w.id]={nome:w.nome,plan:await load("semanas/v2-"+w.id),log:await load("registro/v2-"+w.id),res:await load("resultados/v2-"+w.id)}}catch(e){}
 }
 state.hist=out;state.histLoading=false;if(state.tab==="painel")render();
}
const pct=x=>Math.round((x||0)*100)+"%";
const bar=(x,color)=>`<div class="hb"><span><b style="width:${Math.min(100,Math.round((x||0)*100))}%;background:${color}"></b></span>${pct(x)}</div>`;
function histPanel(){
 if(!state.hist&&!state.histLoading)setTimeout(loadHist,0);
 const list=(state.weeks&&state.weeks.length?state.weeks:[{id:state.week.id,nome:state.week.nome}]).slice(-12);
 if(!list.some(w=>w.id===state.week.id))list.push({id:state.week.id,nome:state.week.nome});
 list.sort((a,b)=>a.id.localeCompare(b.id));
 const rows=list.map(w=>{const cur=w.id===state.week.id,h=(state.hist||{})[w.id];
  const st=cur?weekStats(state.week,state.log,state.res):(h&&h.plan?weekStats(h.plan,h.log,h.res):null);return {w,st,cur}}).filter(r=>r.st);
 let trend="";
 if(rows.length>=2){const a=rows[rows.length-2].st,b=rows[rows.length-1].st;
  const t=(n,x,y)=>`${esc(n)}: adesão ${y>x?"subiu":y<x?"caiu":"manteve"} ${y!==x?`de ${pct(x)} para `:"em "}<b>${pct(y)}</b>`;
  trend=`<p class="trend">${t(NP(),a.adPo,b.adPo)}. ${t(NA(),a.adPa,b.adPa)}.</p>`}
 return `<div class="panel wide"><h3>Evolução semana a semana</h3><p class="sub">Adesão aos treinos, km realizados, sono e dieta de cada semana, para acompanhar o desempenho dos dois ao longo do tempo.</p>
 ${state.histLoading&&!state.hist?`<p class="sub">Carregando semanas anteriores…</p>`:""}
 <div class="tbl"><table class="hist"><thead><tr><th>Semana</th><th>Treinos ${esc(NP())}</th><th>Treinos ${esc(NA())} (com corridas)</th><th>Km corridos ${esc(NA())}</th><th>Km corridos ${esc(NP())}</th><th>Sono 7h+ (${esc(NP())} / ${esc(NA())})</th><th>Dieta (${esc(NP())} / ${esc(NA())})</th></tr></thead><tbody>
 ${rows.map(({w,st,cur})=>`<tr><td><b>${esc(w.nome||w.id)}</b>${cur?' <span style="color:var(--muted)">(atual)</span>':""}</td>
  <td>${bar(st.adPo,"var(--power)")}<span class="mt">${st.po} de ${st.poPlan}</span></td>
  <td>${bar(st.adPa,"var(--pace)")}<span class="mt">${st.pa} de 6, corridas ${st.runsDone} de ${st.runs}</span></td>
  <td>${num(st.kmPa.toFixed(1))} km</td><td>${num(st.kmPo.toFixed(1))} km</td>
  <td>${st.sonoPo} / ${st.sonoPa} dias</td><td>${pct(st.refPo)} / ${pct(st.refPa)}</td></tr>`).join("")}
 </tbody></table></div>${trend}
 <div class="actions"><button class="btn sm ghost" data-act="hist-reload">Atualizar histórico</button></div></div>`;
}

/* Integração direta com a API do Gemini */
function blobToBase64(blob){
 return new Promise((ok,no)=>{
  const r=new FileReader();
  r.onload=()=>ok(String(r.result).split(",")[1]||"");
  r.onerror=()=>no({code:"script"});
  r.readAsDataURL(blob);
 });
}
/* reduz fotos grandes (até 1600 px, JPEG) para caber no envio pela Vercel */
async function shrinkImage(blob){
 try{
  const bmp=await createImageBitmap(blob);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
  if(k===1&&blob.size<1500000)return blob;
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(b=>r(b||blob),"image/jpeg",.82));
 }catch(e){return blob}
}
async function geminiJson(prompt,images,signal){
 const apiKey=getApiKey();
 if(!apiKey&&!state.aiServer) throw {code:"no_key"};
 const parts=[{text:prompt}];
 if(images&&images.length){
  for(let img of images){
   if(!apiKey)img=await shrinkImage(img);
   const b64=await blobToBase64(img);
   parts.push({inlineData:{mimeType:img.type||"image/jpeg",data:b64}});
  }
 }
 const payload=JSON.stringify({contents:[{parts}],generationConfig:{responseMimeType:"application/json"}});
 /* sem chave no aparelho, usa a chave guardada com segurança na Vercel (/api/gemini) */
 const url=apiKey?`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`:"/api/gemini";
 const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:payload,signal});
 if(!res.ok){
  if(res.status===400||res.status===403) throw {code:"bad_key"};
  if(res.status===429) throw {code:"rate_limited"};
  throw {code:"api_err"};
 }
 const data=await res.json();
 const raw=data?.candidates?.[0]?.content?.parts?.[0]?.text||"";
 const clean=raw.replace(/^```json\s*/i,"").replace(/```\s*$/,"").trim();
 return JSON.parse(clean);
}

   <div class="apply">${slot}<select data-role="slot" aria-label="Para quem"><option value="power">${esc(NP())}</option><option value="a">${esc(NA())}: opção 1</option><option value="b">${esc(NA())}: opção 2</option></select>
   <button class="btn sm" data-act="aplicar" data-id="${esc(t.id)}">Usar na semana</button><button class="link" data-act="del-lib" data-id="${esc(t.id)}" style="margin-left:auto;color:${state.delConfirm===t.id?"var(--z5)":"var(--muted)"}">${state.delConfirm===t.id?"Confirmar exclusão":"Excluir"}</button></div></article>`).join("")}</div>`
 :`<div class="empty">${state.lib.length?"Nenhum treino nesta categoria.":"Nenhum treino na biblioteca ainda. Envie um arquivo (TXT, PDF, Word ou foto) ou cole o texto."}</div>`}`;
}
async function importLib(input,nome){
 const id="upl-lib";
 try{
  if(!input.images&&!(input.text||"").trim())throw {code:"vazio"};
  const chunks=input.images?[input]:(()=>{const t=input.text,out=[];for(let i=0;i<t.length;i+=18000)out.push({text:t.slice(i,i+18000)});return out})();
  let total=0;
  for(let c=0;c<chunks.length;c++){
   say(id,`Organizando os treinos com o Gemini${chunks.length>1?` (parte ${c+1} de ${chunks.length})`:""}…`);
   const r=await ask(`Este conteúdo tem um ou mais treinos escritos por um treinador (Crossfit, musculação, Hyrox, funcional, corrida). Separe cada treino e transcreva fielmente, sem inventar exercícios, séries ou cargas. Responda APENAS JSON: {"treinos":[{"titulo":"curto","categoria":"Cross|Musculação|Hyrox|Funcional|Corrida|Mobilidade","para":"power se for de Crossfit, Hyrox ou força; pace se for de corrida ou fortalecimento para corredora; ambos se servir aos dois","desc":"1 frase simples com o objetivo do treino","tipo":"","min":número estimado,"rpe":1-10 estimado,"km":número,"zonas":[5 números de minutos em Z1..Z5 do trabalho aeróbico, zeros se não houver],"blocos":[{"nome":"","itens":[{"t":"exercício com séries, repetições, carga ou tempo","d":"1 frase curta de como executar o movimento, para um leigo não interpretar errado"}]}]}]}. Use português do Brasil.`,chunks[c]);
   const ts=(r&&r.treinos||[]).filter(okS);
   for(const t of ts){
    t.fonte=nome||"";t.criado=Date.now();t.zonas=t.zonas.slice(0,5);
    t.id="l"+Date.now()+Math.random().toString(36).slice(2,6);
    if(window.fb&&window.fb.ready){try{await window.fb.saveLib(t.id,t)}catch(e){}}
    state.lib.push(t);total++;
   }
  }
  lsSet("biblioteca",state.lib);
  if(!total)throw {code:"vazio"};
  render();say(id,`${total} treino${total>1?"s":""} adicionado${total>1?"s":""} à biblioteca.`);
 }catch(e){say(id,ERR(e))}
}
function libForPrompt(){if(!state.lib.length)return "vazia";let out="";for(const t of state.lib){const line=`- ${t.titulo} [${t.categoria}, ${t.para}]: `+(t.blocos||[]).map(b=>b.nome+": "+(b.itens||[]).map(i=>typeof i==="string"?i:i.t).join("; ")).join(" | ")+"\n";if(out.length+line.length>14000)break;out+=line}return out}
function aplicar(id,d,slot){
 const t=state.lib.find(x=>x.id===id);if(!t)return;
 const s={titulo:t.titulo,desc:t.desc||"",tipo:t.tipo||t.categoria||"Treino",min:+t.min||0,rpe:+t.rpe||0,km:+t.km||0,zonas:(t.zonas||[0,0,0,0,0]).slice(0,5),blocos:t.blocos||[],nota:""};
 const day=state.week.dias[d];if(slot==="power")day.power=s;else day.pace[slot]=s;
 if(slot!=="power"){state.log.opt[d]=slot;saveLog({opt:{[d]:slot}})}
 savePlan();state.dia=d;state.tab="dia";render();scrollTo(0,0);
}
async function delLib(id){
 if(state.delConfirm!==id){state.delConfirm=id;render();return;}
 state.delConfirm=null;
 state.lib=state.lib.filter(x=>x.id!==id);lsSet("biblioteca",state.lib);
 if(window.fb&&window.fb.ready){try{await window.fb.delLib(id)}catch(e){}}
 render();
}

/* Eventos de interface */
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;state.tab=b.dataset.tab;state.delConfirm=null;state.editing=null;render();scrollTo(0,0)});
const view=document.getElementById("view");
view.addEventListener("click",e=>{
 const t=e.target.closest("button,tr[data-go]");if(!t)return;
 if(t.dataset.dia!==undefined){state.dia=+t.dataset.dia;state.editing=null;state.redo=null;render();return}
 if(t.dataset.dietDia!==undefined){state.dia=+t.dataset.dietDia;render();return}
 if(t.dataset.dietWho!==undefined){state.dietWho=t.dataset.dietWho;state.dietDraft=null;render();return}
 if(t.dataset.go!==undefined){state.dia=+t.dataset.go;state.editing=null;state.tab="dia";render();scrollTo(0,0);return}
 if(t.dataset.opt){state.log.opt[t.dataset.d]=t.dataset.opt;state.editing=null;saveLog({opt:{[t.dataset.d]:t.dataset.opt}});render();return}
 if(t.dataset.genWho!==undefined){const a=document.getElementById("ajustes");if(a)state.ajustesTxt=a.value;state.genWho=t.dataset.genWho;render();return}
 const act=t.dataset.act;
 if(act==="redo-card"){state.editing=null;state.redo={d:+t.dataset.d,slot:t.dataset.slot,pedido:"",draft:null,loading:false,err:""};render();return}
 if(act==="redo-go")return redoGo();
 if(act==="redo-use")return redoUse();
 if(act==="redo-retry"){if(state.redo){state.redo.draft=null;render()}return}
 if(act==="redo-cancel"){state.redo=null;render();return}
 if(act==="usar-parte")return usarParte();
 if(act==="desc-parte"){state.partDraft=null;render();return}
 if(act==="diet-st"){
  const who=state.dietWho==="pace"?"pace":"power";
  const k=`${state.dia}:${who}`;
  state.log.dietStatus=state.log.dietStatus||{};
  state.log.dietStatus[k]=(state.log.dietStatus[k]===t.dataset.st)?"":t.dataset.st;
  const obsEl=document.getElementById("diet-obs-input");
  if(obsEl){state.log.dietObs=state.log.dietObs||{};state.log.dietObs[k]=obsEl.value.trim();}
  saveLog({dietStatus:{[k]:state.log.dietStatus[k]},dietObs:{[k]:(state.log.dietObs||{})[k]||""}});render();return;
 }
 if(act==="save-diet-obs"){
  const who=state.dietWho==="pace"?"pace":"power";
  const k=`${state.dia}:${who}`;
  const obsEl=document.getElementById("diet-obs-input");
  state.log.dietObs=state.log.dietObs||{};
  state.log.dietObs[k]=obsEl?obsEl.value.trim():"";
  saveLog({dietObs:{[k]:state.log.dietObs[k]}});render();return;
 }
 if(act==="hist-reload"){state.hist=null;render();return}
 if(act==="imp-res")return pick("res",".csv,.txt,.tsv,.pdf,image/*",t.dataset.who||"pace");
 if(act==="imp-dieta")return pick("dieta",".pdf,.docx,.txt,image/*");
 if(act==="imp-lib")return pick("lib",".txt,.md,.pdf,.docx,.csv,image/*");
 if(act==="imp-runsheet")return pick("runsheet",".pdf,.txt,.csv,image/*");
 if(act==="paste-lib"){const tx=document.getElementById("paste-lib").value.trim();if(tx)importLib({text:tx},"texto colado");return}
 if(act==="paste-week"){
  const st=document.getElementById("gst");
  try{
   const raw=document.getElementById("paste-week-json").value.trim().replace(/^```json\s*/i,"").replace(/```\s*$/,"");
   const w=JSON.parse(raw);if(!valid(w))throw 0;
   w.dias.forEach(d=>{if(!d.pace.corrida)d.pace.corrida=null});
   state.draft=w;document.getElementById("prev").innerHTML=prevHTML(w);if(st)st.textContent="Semana carregada! Confira abaixo e clique em Usar esta semana.";
  }catch(err){if(st)st.textContent="Formato inválido. Cole o bloco JSON completo da semana."}
  return;
 }
 if(act==="edit-card"){state.redo=null;state.editing={dia:+t.dataset.d,slot:t.dataset.slot};render();return}
 if(act==="cancel-edit"){state.editing=null;render();return}
 if(act==="save-edit"){
  const box=t.closest(".edit-form"),d=+box.dataset.editDia,slot=box.dataset.editSlot;
  const target=slot==="power"?state.week.dias[d].power:(slot==="corrida"?state.week.dias[d].pace.corrida:state.week.dias[d].pace[slot]);
  if(target){
   target.titulo=box.querySelector('[data-ef="titulo"]').value.trim()||target.titulo;
   target.desc=box.querySelector('[data-ef="desc"]').value.trim();
   target.min=+box.querySelector('[data-ef="min"]').value||0;
   target.rpe=+box.querySelector('[data-ef="rpe"]').value||0;
   const lines=box.querySelector('[data-ef="itens"]').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
   if(slot==="corrida"){target.passos=lines;}
   else{
    const bls=[];let cur={nome:"Treino",itens:[]};
    lines.forEach(ln=>{if(ln.startsWith("#")){if(cur.itens.length)bls.push(cur);cur={nome:ln.replace(/^#+\s*/,"")||"Bloco",itens:[]}}else cur.itens.push(ln)});
    if(cur.itens.length)bls.push(cur);
    target.blocos=bls;
   }
   savePlan();
  }
  state.editing=null;render();return;
 }
 if(act==="usar-dieta"){const d=state.dietDraft;if(!d)return;
  if(d.who==="power"){const doc={data:d.data||"",kcal:d.kcal||null,titulo:d.titulo||"",resumo:d.resumo||"",macros:d.macros||[],notas:d.notas||"",refeicoes:d.refeicoes};applyDietPo(doc);save("dieta-ewerton/v2",doc)}
  else{applyDiet(d);save("dieta/v2",{data:state.diet.data,kcal:state.diet.kcal,refeicoes:MEALS_JOANNA})}
  state.dietDraft=null;render();return}
 if(act==="desc-dieta"){state.dietDraft=null;document.getElementById("prev-dieta").innerHTML="";return}
 if(act==="aplicar"){const card=t.closest(".apply");aplicar(t.dataset.id,+card.querySelector('[data-role="dia"]').value,card.querySelector('[data-role="slot"]').value);return}
 if(act==="del-lib")return delLib(t.dataset.id);
 if(act==="save-key"){const inp=document.getElementById("nova-apikey");const val=(inp&&inp.value||"").trim();if(val){localStorage.setItem("gemini_api_key",val);state.cfg.geminiKey=val;save(P_CFG,state.cfg);render();}return}
 if(t.dataset.cat){state.libFilter=t.dataset.cat;render();return}
 if(t.id==="gerar")gerar(); if(t.id==="parar")ctl?.abort(); if(t.id==="usar")usar();
 if(t.id==="desc"){state.draft=null;document.getElementById("prev").innerHTML="";document.getElementById("gst").textContent=""}
});
view.addEventListener("change",e=>{
 const k=e.target.dataset.k;
 if(k){setC(k,e.target.checked);if(state.tab==="dia"&&/:(treino|corrida)$/.test(k))render();return}
 const c=e.target.dataset.cfg;if(!c)return;const val=e.target.value.trim();
 if(c==="pace")state.cfg.paces[+e.target.dataset.i]=val;
 if(c==="np")state.cfg.nomes.power=val||"Ewerton";
 if(c==="na")state.cfg.nomes.pace=val||"Joanna";
 if(c==="prova")state.cfg.prova=val;
 if(c==="apikey"){state.cfg.geminiKey=val;if(val)localStorage.setItem("gemini_api_key",val);else localStorage.removeItem("gemini_api_key");}
 save(P_CFG,state.cfg);render();
});
document.getElementById("wk").addEventListener("change",e=>{if(e.target.id==="wk-switch")switchWeek(e.target.value)});

document.getElementById("fileIn").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;const k=e.target.dataset.kind;
 if(k==="res")importRes(f,e.target.dataset.who||"pace");
 if(k==="dieta")importDieta(f);
 if(k==="runsheet")importRunSheet(f);
 if(k==="lib"){say("upl-lib","Lendo o arquivo…");try{importLib(await readInput(f),f.name)}catch(err){say("upl-lib",ERR(err))}}
});

/* Inicialização e Observadores em Tempo Real */
function applyCfg(c){if(!c)return;if(Array.isArray(c.paces))state.cfg.paces=c.paces;if(c.nomes)state.cfg.nomes={...state.cfg.nomes,...c.nomes};if(typeof c.prova==="string")state.cfg.prova=c.prova;if(typeof c.geminiKey==="string"&&c.geminiKey){state.cfg.geminiKey=c.geminiKey;localStorage.setItem("gemini_api_key",c.geminiKey)}}
function applyLog(l){state.log=l&&l.chk?{chk:l.chk,opt:l.opt||{},dietStatus:l.dietStatus||{},dietObs:l.dietObs||{}}:{chk:{},opt:{},dietStatus:{},dietObs:{}}}

let unsubWeek=[];
function bindWeekWatchers(){
 unsubWeek.forEach(fn=>{try{fn()}catch(e){}});
 unsubWeek=[];
 if(!window.fb||!window.fb.ready)return;
 unsubWeek.push(window.fb.watch(pLog(),(l)=>{
  applyLog(l);lsSet(pLog(),state.log);render();
 }));
 unsubWeek.push(window.fb.watch(pRes(),(rr)=>{
  state.res={pace:(rr&&rr.pace)||{},power:(rr&&rr.power)||{}};
  lsSet(pRes(),state.res);render();
 }));
}

async function initCloud(){
 /* o script do Firebase é um módulo e só roda depois deste: espera ele ficar pronto */
 for(let i=0;i<150&&!window.dbReady;i++)await new Promise(r=>setTimeout(r,100));
 if(!window.dbReady){fbFail({code:"load-failed"});return}
 const ok=await window.dbReady;
 if(!ok||!window.fb||!window.fb.ready){fbFail(window.fbError||{code:"unavailable"});return}
 try{await window.fb.get(P_CFG);await window.fb.merge("status/ping",{t:Date.now()})}
 catch(e){fbFail(e);return}
 state.connected=true;syncOk();

 const hw=await load(P_PLAN);if(valid(hw)){state.week=hw;state.currentId=hw.id}
 const hwl=await load(P_WEEKS);if(hwl&&Array.isArray(hwl.list))state.weeks=hwl.list;
 else state.weeks=[{id:state.week.id,nome:state.week.nome}];
 applyLog(await load(pLog()));
 const hc=await load(P_CFG);if(hc)applyCfg(hc);
 const hrr=await load(pRes());if(hrr)state.res={pace:hrr.pace||{},power:hrr.power||{}};
 applyDiet(await load("dieta/v2"));
 applyDietPo(await load("dieta-ewerton/v2"));

 try{
  const items=await window.fb.listLib();
  state.lib=items.sort((a,b)=>(a.criado||0)-(b.criado||0));
  lsSet("biblioteca",state.lib);
 }catch(e){}

 /* Sincronização em tempo real entre dispositivos */
 window.fb.watch(P_PLAN,(w)=>{
  if(!valid(w))return;
  const wasCurrent=!state.currentId||state.week.id===state.currentId;
  state.currentId=w.id;lsSet(P_PLAN,w);
  if(!wasCurrent)return; /* quem está olhando uma semana antiga continua nela */
  const changed=w.id!==state.week.id;state.week=w;
  if(changed){state.hist=null;load(pLog()).then(l=>{applyLog(l);load(pRes()).then(rr=>{state.res={pace:(rr&&rr.pace)||{},power:(rr&&rr.power)||{}};bindWeekWatchers();render()})})}
  else render();
 });
 window.fb.watch(P_CFG,(c)=>{applyCfg(c);lsSet(P_CFG,state.cfg);render()});
 window.fb.watch(P_WEEKS,(wl)=>{if(wl&&Array.isArray(wl.list)){state.weeks=wl.list;render()}});
 window.fb.watch("dieta/v2",(d)=>{applyDiet(d);lsSet("dieta/v2",d);render()});
 window.fb.watch("dieta-ewerton/v2",(d)=>{applyDietPo(d);lsSet("dieta-ewerton/v2",d);render()});
 bindWeekWatchers();
 render();
}

(function init(){
 const w=lsGet(P_PLAN);if(valid(w)){state.week=w;state.currentId=w.id}
 applyLog(lsGet(pLog()));applyCfg(lsGet(P_CFG));
 const lr=lsGet(pRes());if(lr)state.res={pace:lr.pace||{},power:lr.power||{}};
 applyDiet(lsGet("dieta/v2"));applyDietPo(lsGet("dieta-ewerton/v2"));state.lib=lsGet("biblioteca")||[];
 state.weeks=[{id:state.week.id,nome:state.week.nome}];
 state.dia=Math.max(0,todayIdx());render();
 initCloud();
 fetch("/api/gemini").then(r=>r.ok?r.json():null).then(j=>{if(j&&j.ok){state.aiServer=true;render()}}).catch(()=>{});
})();
</script>
